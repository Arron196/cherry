name: contract-guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check compatibility exit criteria gate
        run: python -X utf8 scripts/check_compat_exit_criteria.py

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run OpenAPI contract guard
        run: python -X utf8 scripts/contract_guard.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Docker smoke (profile smoke)
        run: docker compose --profile smoke up --build --abort-on-container-exit --exit-code-from smoke smoke

      - name: Docker cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  evm-localchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install py-solc-x

      - name: Install Foundry (Anvil)
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          ~/.foundry/bin/foundryup
          echo "$HOME/.foundry/bin" >> $GITHUB_PATH

      - name: Install solc 0.8.24
        run: |
          python -c "from solcx import install_solc; install_solc('0.8.24')"

      - name: Start Anvil
        run: |
          anvil --host 127.0.0.1 --port 8545 --silent > anvil.log 2>&1 &
          echo $! > anvil.pid
          sleep 3

      - name: Run EVM local-chain e2e
        env:
          RUN_EVM_E2E: "1"
          ANVIL_RPC_URL: http://127.0.0.1:8545
          ANVIL_PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
        run: |
          python -m pytest -q tests/e2e/test_evm_anchor_localchain.py

      - name: Dump Anvil logs on failure
        if: failure()
        run: cat anvil.log

      - name: Stop Anvil
        if: always()
        run: |
          if [ -f anvil.pid ]; then kill "$(cat anvil.pid)" || true; fi
